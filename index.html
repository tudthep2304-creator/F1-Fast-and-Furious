<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>F1 Driver - แอปคนขับ (Fixed)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  </head>
<body class="h-screen w-screen m-0 bg-gray-900">
  <div id="map" class="fixed inset-0 z-0"></div>

  <script>
    // ... (ส่วนตั้งค่า Firebase เดิมของคุณ) ...
    // เพิ่มตัวแปรสำหรับคุม Markers ให้เสถียร
    let markers = { driver: null, pick: [], drop: [] };

    function updateDriverMarker(lat, lng) {
        if (!map) return;
        const pos = { lat: parseFloat(lat), lng: parseFloat(lng) };
        if (!markers.driver) {
            markers.driver = new google.maps.Marker({
                position: pos,
                map: map,
                icon: { url: "https://img.icons8.com/color/48/car-top-view.png", scaledSize: new google.maps.Size(44, 44), anchor: new google.maps.Point(22, 22) },
                zIndex: 9999
            });
        } else {
            markers.driver.setPosition(pos);
            markers.driver.setMap(map);
        }
    }

    // แก้ไขฟังก์ชันการวาดจุดรับ/ส่ง ให้ล้างของเก่าเสมอ
    function updateJobMarkers(waypoints) {
        // ล้างหมุดเก่า
        markers.pick.forEach(m => m.setMap(null));
        markers.drop.forEach(m => m.setMap(null));
        markers.pick = []; markers.drop = [];

        waypoints.forEach(wp => {
            let icon = wp.type === 'pick' ? 'https://img.icons8.com/color/48/marker-g.png' : 'https://img.icons8.com/color/48/marker-r.png';
            let m = new google.maps.Marker({
                position: {lat: wp.lat, lng: wp.lng},
                map: map,
                icon: { url: icon, scaledSize: new google.maps.Size(32, 32) }
            });
            if(wp.type === 'pick') markers.pick.push(m);
            else markers.drop.push(m);
        });
    }

    // ตรวจสอบการซิงค์ข้อมูลตำแหน่งรถ
    db.ref('driver').on('value', (snap) => {
        const d = snap.val();
        if(d && d.lat && d.lng) {
            driverLat = d.lat;
            driverLng = d.lng;
            updateDriverMarker(d.lat, d.lng);
        } else {
            console.warn("Firebase: ไม่ได้รับพิกัดคนขับ");
        }
    });

    // ตรวจสอบงาน (Booking Listener)
    db.ref('bookings').on('value', (snap) => {
        allBookings = snap.val();
        processBookings(); // ฟังก์ชันประมวลผลงานของคุณ
    });

    function initMap() {
      map = new google.maps.Map(document.getElementById('map'), { 
        zoom: 16, center: {lat: 19.910479, lng: 99.840576}, mapTypeId: 'roadmap',
        styles: darkMapStyle 
      });
      console.log("Map Initialized");
    }
  </script>
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_KEY&callback=initMap" async defer></script>
</body>
</html>
