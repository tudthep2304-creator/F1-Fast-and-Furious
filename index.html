<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>F1 Driver - คนขับ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col">

  <div class="bg-green-700 text-white p-4 flex justify-between items-center shadow-md z-10">
    <h1 class="font-bold text-lg">โหมดคนขับ F1</h1>
    <label class="relative inline-flex items-center cursor-pointer">
      <input type="checkbox" id="toggleStatus" class="sr-only peer" onchange="toggleOnline()">
      <div class="w-11 h-6 bg-red-400 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-400"></div>
      <span class="ml-3 text-sm font-bold" id="statusText">ออฟไลน์</span>
    </label>
  </div>

  <div id="map" class="flex-1 w-full bg-gray-300 z-0"></div>

  <div id="controlPanel" class="bg-white rounded-t-3xl shadow-[0_-10px_20px_rgba(0,0,0,0.1)] p-5 z-10">
    
    <div id="queueView">
      <h2 class="font-bold mb-3">📋 คิวงานรอดำเนินการ (<span id="qCount">0</span>)</h2>
      <div id="queueList" class="space-y-3 max-h-[30vh] overflow-y-auto"></div>
    </div>

    <div id="activeView" class="hidden">
      <div class="flex justify-between items-center border-b pb-2 mb-3">
        <h2 class="font-bold text-green-700">กำลังให้บริการ</h2>
        <span id="jobPrice" class="font-black text-lg">฿0</span>
      </div>
      <p class="text-sm font-bold"><i class="fas fa-user"></i> <span id="jobName">...</span> (<a id="jobPhone" href="#" class="text-blue-600 underline">...</a>)</p>
      <div class="bg-gray-50 p-3 rounded-lg my-3 text-xs text-gray-600 space-y-1">
        <p><b>รับ:</b> <span id="jobPick">...</span></p>
        <p><b>ส่ง:</b> <span id="jobDrop">...</span></p>
      </div>
      
      <select id="statusSelect" onchange="changeJobStatus()" class="w-full p-3 border rounded-xl mb-3 font-bold text-center bg-blue-50 outline-none">
        <option value="คนขับรับงานของคุณแล้ว กำลังเดินทางไปหาครับ">1. กำลังไปรับลูกค้า</option>
        <option value="คนขับมาถึงจุดรับแล้วครับ">2. ถึงจุดรับแล้ว</option>
        <option value="ออกเดินทาง! กำลังมุ่งหน้าสู่จุดหมายครับ">3. รับลูกค้า/ออกเดินทาง</option>
        <option value="ถึงที่หมายอย่างปลอดภัย ขอบคุณที่ใช้บริการ F1 Driver ครับ!">4. ถึงที่หมาย (จบงาน)</option>
      </select>

      <div class="flex gap-2">
        <a id="lineChatBtn" href="https://line.me/R/ti/p/@YOUR_OA_ID" target="_blank" class="flex-1 bg-green-500 text-white text-center py-3 rounded-xl font-bold text-sm"><i class="fab fa-line"></i> แชทลูกค้า</a>
        <button onclick="navDriver()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold text-sm"><i class="fas fa-location-arrow"></i> นำทาง</button>
      </div>
      <button onclick="cancelJobByDriver()" class="w-full mt-2 bg-red-100 text-red-600 py-2 rounded-xl font-bold text-sm">ยกเลิกงานนี้</button>
    </div>

  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwwdopAPESHRrHEYTSa-CzFMbh0JX9WHUa37PMEJmxDkah7ui67cVtOn68cnM-2DtmR/exec"; 
    firebase.initializeApp({ /* ใส่ Config เดียวกัน */ });
    const db = firebase.database();

    let map, marker, watchId;
    let myLat = 19.91, myLng = 99.84;
    let isOnline = false;
    let activeJobId = null;
    let activeJobData = null;

    function initMap() {
      map = new google.maps.Map(document.getElementById('map'), { zoom: 16, center: {lat: myLat, lng: myLng}, mapTypeId: 'hybrid', disableDefaultUI:true});
      marker = new google.maps.Marker({map: map, icon: "https://img.icons8.com/color/48/car-top-view.png"});
      startGPS();
    }

    function startGPS() {
      if(navigator.geolocation) {
        watchId = navigator.geolocation.watchPosition(pos => {
          myLat = pos.coords.latitude; myLng = pos.coords.longitude;
          marker.setPosition({lat: myLat, lng: myLng});
          map.setCenter({lat: myLat, lng: myLng});
          if(isOnline) db.ref('driver').update({lat: myLat, lng: myLng});
        }, e => console.log(e), {enableHighAccuracy: true});
      }
    }

    function toggleOnline() {
      isOnline = document.getElementById('toggleStatus').checked;
      document.getElementById('statusText').innerText = isOnline ? 'ออนไลน์' : 'ออฟไลน์';
      
      const ref = db.ref('driver');
      if(isOnline) {
        ref.set({status: "ออนไลน์", lat: myLat, lng: myLng});
        // 🌟 ตั้งเวลาออฟไลน์อัตโนมัติเมื่อปิดเว็บ (ระบบจะเตะออฟไลน์ทันทีที่เน็ตหลุด/ปิดแท็บ)
        ref.onDisconnect().update({status: "ออฟไลน์"});
      } else {
        ref.update({status: "ออฟไลน์"});
        ref.onDisconnect().cancel();
      }
    }

    // ดึงงาน
    db.ref('bookings').on('value', snap => {
      const data = snap.val() || {};
      let qHtml = ""; let count = 0;
      let hasActive = false;

      for(let key in data) {
        let job = data[key];
        if(job.status === "รอผู้ขับขี่ตอบรับ") {
          count++;
          qHtml += `
            <div class="bg-gray-50 border p-3 rounded-xl flex justify-between items-center">
              <div>
                <p class="font-bold text-sm text-blue-700">${job.name}</p>
                <p class="text-xs text-gray-500 truncate w-40">รับ: ${job.pName}</p>
              </div>
              <button onclick="acceptJob('${key}')" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold text-xs">รับงาน (฿${job.price})</button>
            </div>
          `;
        } else if (job.status !== "ยกเลิกโดยคนขับ" && job.status !== "ถึงที่หมายอย่างปลอดภัย ขอบคุณที่ใช้บริการ F1 Driver ครับ!") {
          hasActive = true; activeJobId = key; activeJobData = job;
        }
      }

      document.getElementById('qCount').innerText = count;
      document.getElementById('queueList').innerHTML = qHtml || "<p class='text-xs text-gray-400'>ยังไม่มีคิวงาน</p>";

      if(hasActive) showActiveJob(); else showQueue();
    });

    function acceptJob(id) {
      let statusText = "คนขับรับงานของคุณแล้ว กำลังเดินทางไปหาครับ";
      db.ref('bookings/' + id).update({status: statusText}).then(() => {
        fetch(`${APPS_SCRIPT_URL}?action=notify&type=accept&userId=${id}&msg=${statusText}`, {mode:'no-cors'});
      });
    }

    function showActiveJob() {
      document.getElementById('queueView').classList.add('hidden');
      document.getElementById('activeView').classList.remove('hidden');
      document.getElementById('jobName').innerText = activeJobData.name;
      document.getElementById('jobPhone').innerText = activeJobData.phone;
      document.getElementById('jobPhone').href = "tel:" + activeJobData.phone;
      document.getElementById('jobPick').innerText = activeJobData.pName;
      document.getElementById('jobDrop').innerText = activeJobData.dName;
      document.getElementById('jobPrice').innerText = "฿" + activeJobData.price;
      document.getElementById('statusSelect').value = activeJobData.status;
    }

    function showQueue() {
      document.getElementById('activeView').classList.add('hidden');
      document.getElementById('queueView').classList.remove('hidden');
      activeJobId = null; activeJobData = null;
    }

    function changeJobStatus() {
      let newStat = document.getElementById('statusSelect').value;
      if(activeJobId) {
        db.ref('bookings/' + activeJobId).update({status: newStat}).then(()=>{
            if(newStat.includes("ใกล้ถึงแล้ว") || newStat.includes("ออกเดินทาง") || newStat.includes("ถึงที่หมาย")) {
                fetch(`${APPS_SCRIPT_URL}?action=notify&type=status_update&userId=${activeJobId}&msg=${newStat}`, {mode:'no-cors'});
            }
        });
      }
    }

    function cancelJobByDriver() {
      if(confirm('ยืนยันยกเลิกงานนี้ทิ้ง?')) {
        db.ref('bookings/' + activeJobId).update({status: "ยกเลิกโดยคนขับ"});
        fetch(`${APPS_SCRIPT_URL}?action=notify&type=cancel_driver&userId=${activeJobId}`, {mode:'no-cors'});
      }
    }

    function navDriver() {
      if(!activeJobData) return;
      let dLat = activeJobData.status.includes("ออกเดินทาง") ? activeJobData.dLat : activeJobData.pLat;
      let dLng = activeJobData.status.includes("ออกเดินทาง") ? activeJobData.dLng : activeJobData.pLng;
      window.open(`https://www.google.com/maps/dir/?api=1&origin=${myLat},${myLng}&destination=${dLat},${dLng}&travelmode=driving`, '_blank');
    }
  </script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSy...&callback=initMap" async defer></script>
</body>
</html>
