<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>F1 Driver - แอปคนขับ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap');
    body { font-family: 'Kanit', sans-serif; background-color: #f3f4f6; }
    .map-container { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; background: #e5e7eb; }
    .ui-panel { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top-left-radius: 24px; border-top-right-radius: 24px; box-shadow: 0 -10px 25px rgba(0,0,0,0.15); z-index: 10; display: flex; flex-direction: column; padding: 20px; max-height: 80vh; overflow-y: auto;}
  </style>
</head>
<body class="h-screen w-screen m-0 overflow-hidden">

  <div id="map" class="map-container"></div>

  <div class="fixed top-0 w-full h-16 bg-[#2B3A6F] flex items-center justify-center px-4 z-20 text-white shadow-md">
    <h1 class="text-lg font-bold"><i class="fas fa-car-side mr-2"></i> แอปคนขับ F1</h1>
  </div>

  <div id="idlePanel" class="ui-panel h-auto pb-8 pt-5">
    <div class="flex justify-between items-center mb-4">
      <div>
        <h2 class="font-bold text-lg text-gray-800">โหมดรับงาน</h2>
        <p class="text-sm font-bold text-red-500" id="statusText">🔴 ออฟไลน์</p>
      </div>
      <label class="relative inline-flex items-center cursor-pointer">
        <input type="checkbox" id="onlineToggle" class="sr-only peer" onchange="toggleOnline()">
        <div class="w-14 h-7 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-green-500"></div>
      </label>
    </div>
    <div class="bg-gray-50 p-4 rounded-xl text-center border border-gray-100">
        <p class="text-gray-500 text-sm" id="gpsStatus">รอเปิดระบบเพื่ออัปเดต GPS...</p>
    </div>
  </div>

  <div id="activeJobPanel" class="ui-panel hidden h-auto pb-8 pt-5">
    <div class="flex justify-between items-center border-b pb-2 mb-2">
      <h2 class="font-black text-indigo-700 text-base" id="jobStatusHeader">กำลังเดินทางไปหา</h2>
      <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full font-bold text-sm" id="jobPrice">฿0</span>
    </div>
    
    <div class="bg-blue-50 p-3 rounded-xl mb-3 flex justify-between items-center border border-blue-100">
        <div>
            <p class="text-[11px] text-gray-500">ผู้โดยสาร</p>
            <p class="font-bold text-gray-800 text-sm" id="passengerName">...</p>
        </div>
        <a href="#" id="btnCallPassenger" class="bg-green-500 text-white px-4 py-2 rounded-lg font-bold text-sm shadow-sm flex gap-2 items-center">
            <i class="fas fa-phone-alt"></i> โทร
        </a>
    </div>

    <div class="mb-4 space-y-1">
      <p class="text-[11px] text-gray-400 truncate">รับ: <span class="font-bold text-gray-700" id="jobPick">...</span></p>
      <p class="text-[11px] text-gray-400 truncate">ส่ง: <span class="font-bold text-gray-700" id="jobDrop">...</span></p>
    </div>

    <div class="flex gap-2 mb-2">
        <button id="btnAction" onclick="nextAction()" class="flex-[2] bg-[#2B3A6F] text-white py-3 rounded-xl font-bold text-base shadow-md transition-colors active:bg-blue-800">
            มาถึงจุดรับ
        </button>
        <button onclick="openDriverNavMap()" class="flex-1 bg-blue-100 text-blue-700 py-3 rounded-xl font-bold border border-blue-200 text-sm flex items-center justify-center gap-1">
            <i class="fas fa-location-arrow"></i> นำทาง
        </button>
    </div>
    <button onclick="cancelJob()" class="w-full bg-red-50 text-red-600 py-2 rounded-xl font-bold border border-red-200 text-sm mt-1">ยกเลิกงานนี้</button>
  </div>

  <div id="incomingModal" class="hidden fixed inset-0 z-[100] bg-black/70 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl p-6 w-full max-w-sm text-center shadow-2xl transform transition-all scale-100">
          <div class="w-16 h-16 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl animate-bounce">
              <i class="fas fa-bell"></i>
          </div>
          <h3 class="text-xl font-black text-gray-800 mb-1">งานใหม่เข้า!</h3>
          <p class="text-gray-500 text-sm mb-4">ผู้โดยสารกำลังรอคุณอยู่</p>
          
          <div class="bg-gray-50 rounded-xl p-3 text-left mb-5 space-y-2 border">
              <p class="text-xs text-gray-500 truncate">📍 <span class="font-bold text-gray-800" id="incPick">...</span></p>
              <p class="text-xs text-gray-500 truncate">🏁 <span class="font-bold text-gray-800" id="incDrop">...</span></p>
              <div class="border-t pt-2 mt-2 flex justify-between">
                  <span class="text-xs text-gray-500">ค่าโดยสาร</span>
                  <span class="font-black text-green-600" id="incPrice">฿0</span>
              </div>
          </div>

          <div class="flex gap-3">
              <button onclick="rejectJob()" class="flex-1 py-3 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300">ข้ามงานนี้</button>
              <button onclick="acceptJob()" class="flex-[2] py-3 bg-green-500 text-white font-bold rounded-xl shadow-md hover:bg-green-600">รับงานเลย!</button>
          </div>
      </div>
  </div>

  <script>
    // 🌟 ฐานข้อมูลต้องเหมือนผู้โดยสารเป๊ะๆ
    firebase.initializeApp({
      apiKey: "AIzaSyDsZ_tbFhH6fUXRz3I6C-tMshNwwrSevd4",
      authDomain: "myride-chiangrai.firebaseapp.com",
      databaseURL: "https://myride-chiangrai-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "myride-chiangrai",
      storageBucket: "myride-chiangrai.firebasestorage.app",
      messagingSenderId: "1048189690454",
      appId: "1:1048189690454:web:7c2c4c9bbf12b9c77ed1f7"
    });
    const db = firebase.database();

    let map, directionsService, directionsRenderer;
    let markerDriver, markerPick, markerDrop;
    let driverLat = 19.910479, driverLng = 99.840576; // Default Chiang Rai
    let isOnline = false;
    let watchId = null;
    
    let activeJobId = null;
    let activeJobData = null;
    let incomingJobId = null;

    // เริ่มต้นแผนที่คนขับ
    function initMap() {
      if (typeof google === 'undefined' || typeof google.maps === 'undefined') return;
      map = new google.maps.Map(document.getElementById('map'), { 
        zoom: 15, center: {lat: driverLat, lng: driverLng}, mapTypeId: 'hybrid', disableDefaultUI: true 
      });
      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer({ map: map, suppressMarkers: true, polylineOptions: {strokeColor:'#4285F4', strokeWeight:6} });
      
      markerPick = new google.maps.Marker({map: null, icon: "https://maps.google.com/mapfiles/ms/icons/green-dot.png", zIndex: 2});
      markerDrop = new google.maps.Marker({map: null, icon: "https://maps.google.com/mapfiles/ms/icons/red-dot.png", zIndex: 2});
      
      markerDriver = new google.maps.Marker({
          map: map, 
          position: {lat: driverLat, lng: driverLng},
          icon: {
              url: "https://img.icons8.com/color/48/car-top-view.png",
              scaledSize: new google.maps.Size(44, 44),
              anchor: new google.maps.Point(22, 22)
          }, 
          zIndex: 9999
      });
    }

    // 🌟 ระบบเปิดออนไลน์ และจับ GPS อัตโนมัติ
    function toggleOnline() {
        isOnline = document.getElementById('onlineToggle').checked;
        const statusEl = document.getElementById('statusText');
        const gpsEl = document.getElementById('gpsStatus');

        if(isOnline) {
            statusEl.innerText = "🟢 ออนไลน์ (พร้อมรับงาน)";
            statusEl.className = "text-sm font-bold text-green-600";
            gpsEl.innerText = "กำลังค้นหาพิกัด GPS ของคุณ...";
            
            // อัปเดตฐานข้อมูลให้ผู้โดยสารเห็น
            db.ref('driver').update({ status: "ออนไลน์" });

            // ติดตาม GPS
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition((pos) => {
                    driverLat = pos.coords.latitude;
                    driverLng = pos.coords.longitude;
                    
                    // อัปเดตตำแหน่งตัวเองบนแมพ
                    let posObj = {lat: driverLat, lng: driverLng};
                    if(markerDriver) markerDriver.setPosition(posObj);
                    if(!activeJobId) map.setCenter(posObj); // ซูมหาตัวเองถ้าไม่มีงาน

                    // ส่งขึ้น Firebase
                    db.ref('driver').update({ lat: driverLat, lng: driverLng });
                    gpsEl.innerText = `พิกัดอัปเดตล่าสุด: ${new Date().toLocaleTimeString()}`;
                    
                    if(activeJobId) updateRoute(); // ถ้ามีงานให้อัปเดตเส้นทาง
                }, 
                (err) => { gpsEl.innerText = "GPS Error: กรุณาเปิด Location (ตำแหน่งที่ตั้ง)"; }, 
                { enableHighAccuracy: true, maximumAge: 10000 });
            }
        } else {
            statusEl.innerText = "🔴 ออฟไลน์";
            statusEl.className = "text-sm font-bold text-red-500";
            gpsEl.innerText = "ระบบถูกปิดชั่วคราว";
            
            db.ref('driver').update({ status: "ออฟไลน์" });
            if(watchId) navigator.geolocation.clearWatch(watchId);
        }
    }

    // 🌟 ระบบดักจับงานจากผู้โดยสาร
    db.ref('bookings').on('value', snap => {
        if(!isOnline) return; // ถ้าออฟไลน์อยู่ไม่ต้องสนใจงาน
        const bookings = snap.val();
        if(!bookings) {
            // ไม่มีงานเลย
            if(activeJobId) resetToIdle();
            return;
        }

        // 1. ถ้ามีงานที่เรารับไว้แล้ว (Active)
        if(activeJobId && bookings[activeJobId]) {
            activeJobData = bookings[activeJobId];
            updateActiveJobUI();
            return;
        } else if (activeJobId && !bookings[activeJobId]) {
            // โดนผู้โดยสารกดยกเลิก
            alert("ผู้โดยสารได้ยกเลิกงานนี้แล้ว");
            resetToIdle();
            return;
        }

        // 2. ถ้าไม่มีงานที่ทำอยู่ ให้หางานใหม่ที่สถานะ "รอผู้ขับขี่ตอบรับ"
        let foundNewJob = false;
        for (let key in bookings) {
            let b = bookings[key];
            if (b.status === "รอผู้ขับขี่ตอบรับ" && !document.getElementById('incomingModal').classList.contains('flex')) {
                incomingJobId = key;
                document.getElementById('incPick').innerText = b.pName;
                document.getElementById('incDrop').innerText = b.dName;
                document.getElementById('incPrice').innerText = "฿" + b.price;
                document.getElementById('incomingModal').classList.remove('hidden');
                document.getElementById('incomingModal').classList.add('flex');
                foundNewJob = true;
                break;
            }
        }
    });

    function rejectJob() {
        document.getElementById('incomingModal').classList.add('hidden');
        document.getElementById('incomingModal').classList.remove('flex');
        incomingJobId = null;
    }

    function acceptJob() {
        if(!incomingJobId) return;
        activeJobId = incomingJobId;
        document.getElementById('incomingModal').classList.add('hidden');
        document.getElementById('incomingModal').classList.remove('flex');
        
        // 🌟 อัปเดตสถานะไปบอกผู้โดยสารว่า "กำลังเดินทางไปหา"
        db.ref('bookings/' + activeJobId).update({ 
            status: "รับงานแล้ว กำลังเดินทางไปหา",
            driverPhone: "0946379669" // แอบส่งเบอร์เข้าไปในระบบ
        });

        document.getElementById('idlePanel').classList.add('hidden');
        document.getElementById('activeJobPanel').classList.remove('hidden');
    }

    // 🌟 อัปเดตหน้าจอคนขับตามสถานะปัจจุบัน
    function updateActiveJobUI() {
        if(!activeJobData) return;
        
        document.getElementById('passengerName').innerText = activeJobData.name || "ลูกค้า";
        document.getElementById('btnCallPassenger').href = "tel:" + activeJobData.phone;
        document.getElementById('jobPick').innerText = activeJobData.pName;
        document.getElementById('jobDrop').innerText = activeJobData.dName;
        document.getElementById('jobPrice').innerText = "฿" + activeJobData.price;

        let statusText = document.getElementById('jobStatusHeader');
        let btnAction = document.getElementById('btnAction');

        let s = activeJobData.status;
        if(s.includes("กำลังเดินทางไปหา")) {
            statusText.innerText = "กำลังเดินทางไปรับ";
            btnAction.innerText = "มาถึงจุดรับ";
            btnAction.className = "flex-[2] bg-[#2B3A6F] text-white py-3 rounded-xl font-bold text-base shadow-md";
            markerPick.setPosition({lat: activeJobData.pLat, lng: activeJobData.pLng}); markerPick.setMap(map);
            markerDrop.setMap(null);
        } 
        else if(s.includes("มาถึงจุดรับ")) {
            statusText.innerText = "รอผู้โดยสารขึ้นรถ";
            btnAction.innerText = "ผู้โดยสารขึ้นรถ";
            btnAction.className = "flex-[2] bg-yellow-500 text-white py-3 rounded-xl font-bold text-base shadow-md";
        } 
        else if(s.includes("ออกเดินทาง") || s.includes("ไปยังจุดส่ง")) {
            statusText.innerText = "กำลังเดินทางไปจุดส่ง";
            btnAction.innerText = "ถึงที่หมาย (จบงาน)";
            btnAction.className = "flex-[2] bg-green-500 text-white py-3 rounded-xl font-bold text-base shadow-md";
            markerDrop.setPosition({lat: activeJobData.dLat, lng: activeJobData.dLng}); markerDrop.setMap(map);
            markerPick.setMap(null);
        }
        
        updateRoute();
    }

    // 🌟 จัดการ Action ปุ่มหลัก
    function nextAction() {
        if(!activeJobId || !activeJobData) return;
        let s = activeJobData.status;
        
        if(s.includes("กำลังเดินทางไปหา")) {
            db.ref('bookings/' + activeJobId).update({ status: "มาถึงจุดรับ" });
        } 
        else if(s.includes("มาถึงจุดรับ")) {
            db.ref('bookings/' + activeJobId).update({ status: "เริ่มออกเดินทาง ไปยังจุดส่ง" });
        } 
        else if(s.includes("ออกเดินทาง") || s.includes("ไปยังจุดส่ง")) {
            if(confirm("ยืนยันการจบงานและรับเงินใช่หรือไม่?")) {
                db.ref('bookings/' + activeJobId).update({ status: "ถึงที่หมาย" });
                alert("จบงานสำเร็จ! รอรับงานถัดไป");
                resetToIdle();
            }
        }
    }

    function cancelJob() {
        if(confirm("คุณต้องการยกเลิกงานนี้ใช่หรือไม่?")) {
            if(activeJobId) {
                db.ref('bookings/' + activeJobId).update({ status: "ยกเลิกโดยคนขับ" });
            }
            resetToIdle();
        }
    }

    function resetToIdle() {
        activeJobId = null;
        activeJobData = null;
        document.getElementById('activeJobPanel').classList.add('hidden');
        document.getElementById('idlePanel').classList.remove('hidden');
        if(directionsRenderer) directionsRenderer.setDirections({routes: []});
        if(markerPick) markerPick.setMap(null);
        if(markerDrop) markerDrop.setMap(null);
        map.setZoom(15);
        map.setCenter({lat: driverLat, lng: driverLng});
    }

    function updateRoute() {
        if(!activeJobData || !directionsService) return;
        let origin = {lat: driverLat, lng: driverLng};
        let dest;

        if(activeJobData.status.includes("กำลังเดินทางไปหา") || activeJobData.status.includes("มาถึงจุดรับ")) {
            dest = {lat: activeJobData.pLat, lng: activeJobData.pLng};
        } else {
            dest = {lat: activeJobData.dLat, lng: activeJobData.dLng};
        }

        directionsService.route({origin: origin, destination: dest, travelMode: 'DRIVING'}, (res, stat) => {
            if(stat === 'OK') {
                directionsRenderer.setDirections(res);
            }
        });
    }

    function openDriverNavMap() {
        if(!activeJobData) return;
        let lat, lng;
        if(activeJobData.status.includes("ออกเดินทาง") || activeJobData.status.includes("ไปยังจุดส่ง")) {
            lat = activeJobData.dLat; lng = activeJobData.dLng;
        } else {
            lat = activeJobData.pLat; lng = activeJobData.pLng;
        }
        window.open(`https://www.google.com/maps/dir/?api=1&origin=${driverLat},${driverLng}&destination=${lat},${lng}&travelmode=driving`, '_blank');
    }

    window.initMap = initMap;
  </script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDsZ_tbFhH6fUXRz3I6C-tMshNwwrSevd4&libraries=places&callback=initMap" async defer></script>
</body>
</html>
